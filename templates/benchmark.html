<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body {
    margin: 0;
    padding: 30px;
    background: #111111;
    color: white;
    font-family: Arial, sans-serif;
}

h1 {
    margin: 0 0 12px 0;
}

.description {
    color: #b9bbbe;
    margin-bottom: 24px;
}

.section-title {
    margin-top: 30px;
    margin-bottom: 12px;
    font-size: 22px;
    font-weight: 700;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 30px;
    background: #1b1b1b;
    border-radius: 12px;
    overflow: hidden;
}

th {
    background: #202225;
    color: white;
    padding: 14px;
    text-align: center;
    font-size: 14px;
}

td {
    padding: 12px;
    text-align: center;
    border-bottom: 1px solid #2b2b2b;
}

tr:last-child td {
    border-bottom: none;
}

.chart-container {

    background:#1b1b1b;

    border-radius:12px;

    padding:20px;

    margin-bottom:30px;

}

.footer {
    margin-top: 24px;
    color: #8f98ab;
    font-size: 14px;
}

canvas{

    width:100% !important;

    height:420px !important;

}

</style>

</head>

<body>

<h1>{{TITLE}}</h1>

<div class="description">
    {{DESCRIPTION}}
</div>

<div class="section-title">
    Current Benchmark
</div>

<table>

    <thead>

        <tr>

            <th>Benchmark</th>
            <th>Entry<br>(Fans / Member / Day)</th>
            <th>Average<br>(Fans / Member / Day)</th>

        </tr>

    </thead>

    <tbody>

        {{BENCHMARK_PROJECTIONS}}

    </tbody>

</table>

<div class="section-title">
    Daily Benchmark Growth
</div>

<div class="chart-container">

    <canvas id="benchmarkChart"></canvas>

</div>

<div class="footer">

{{FOOTER}}

</div>

<script id="chart-data" type="application/json">
{{BENCHMARK_CHART_DATA}}
</script>

<script>

// ---------------------------------------------------------------------------
// Benchmark chart
//
// The data below is injected via the #chart-data JSON block and is NEVER
// modified. Every adjustment in this file is purely visual (pixel-space) so
// that axis values, tooltip values and exported numbers stay exact.
// ---------------------------------------------------------------------------

const chartData = JSON.parse(
    document.getElementById('chart-data').textContent
);

// ---------------------------------------------------------------------------
// Series configuration.
//
// Add a new entry here (e.g. Top 50 / Top 200) to add a new benchmark line.
// Each series gets a distinct colour, dash pattern and point style so lines
// remain identifiable even before any fan-out offset is applied.
// ---------------------------------------------------------------------------
const seriesConfig = [
    {
        key: 'top10',
        label: 'Top 10',
        borderColor: '#ff4d4d',
        backgroundColor: 'rgba(255,77,77,0.12)',
        borderWidth: 4,
        borderDash: [],
        pointStyle: 'circle'
    },
    {
        key: 'top30',
        label: 'Top 30',
        borderColor: '#ffd93d',
        backgroundColor: 'rgba(255,217,61,0.12)',
        borderWidth: 3,
        borderDash: [8, 5],
        pointStyle: 'triangle'
    },
    {
        key: 'top100',
        label: 'Top 100',
        borderColor: '#61b8ff',
        backgroundColor: 'rgba(97,184,255,0.12)',
        borderWidth: 3,
        borderDash: [2, 4],
        pointStyle: 'rectRot'
    }
];

const labels = chartData.map(x => "Day " + x.day);

const allValues = chartData
    .flatMap(x => seriesConfig.map(cfg => x[cfg.key]))
    .filter(v => v != null);

const minValue = Math.min(...allValues);
const maxValue = Math.max(...allValues);

const datasets = seriesConfig.map(cfg => ({

    label: cfg.label,

    data: chartData.map(x => x[cfg.key]),

    borderColor: cfg.borderColor,

    backgroundColor: cfg.backgroundColor,

    fill: true,

    borderWidth: cfg.borderWidth,

    borderDash: cfg.borderDash,

    pointStyle: cfg.pointStyle,

    pointRadius: 6,

    pointHoverRadius: 7,

    pointHoverBorderWidth: 4,

    pointBorderWidth: 3,

    pointBackgroundColor: "#111111",

    tension: 0.45

}));

// ---------------------------------------------------------------------------
// overlapSeparator plugin
//
// Problem: when two lines have nearly identical values (e.g. Top 10 and Top 30
// only a few thousand fans apart), their rendered paths land on top of each
// other and one line is hidden.
//
// Solution: detect those "too close" lines in PIXEL space and fan them out by
// a tiny vertical offset while drawing. The offset is applied only to the
// canvas transform inside the dataset draw hooks, so the underlying data, the
// axis scale and the tooltip values are untouched.
//
// Detection:
//   - For every pair of datasets compute the average distance (in pixels)
//     between their rendered points (nulls ignored).
//   - Pairs closer than `threshold` pixels are considered overlapping.
//   - Datasets connected by overlap edges are grouped into clusters.
//   - Each cluster is fanned out vertically, keeping higher values visually
//     higher on the chart.
//
// When no pair is close enough, no offset is applied at all.
// ---------------------------------------------------------------------------
const overlapSeparator = {

    id: 'overlapSeparator',

    // Average pixel distance below which two lines are considered overlapping.
    threshold: 8,

    // Vertical gap (px) between fanned-out lines.
    spacing: 10,

    beforeDatasetsDraw(chart) {
        chart._lineFanOffsets = computeFanOffsets(
            chart,
            this.threshold,
            this.spacing
        );
    },

    beforeDatasetDraw(chart, args) {
        const dy = (chart._lineFanOffsets || [])[args.index] || 0;
        if (dy !== 0) {
            chart.ctx.save();
            chart.ctx.translate(0, dy);
        }
    },

    afterDatasetDraw(chart, args) {
        const dy = (chart._lineFanOffsets || [])[args.index] || 0;
        if (dy !== 0) {
            chart.ctx.restore();
        }
    }

};

function computeFanOffsets(chart, threshold, spacing) {

    const count = chart.data.datasets.length;
    const offsets = new Array(count).fill(0);

    if (count < 2) return offsets;

    // 1. Find pairs of datasets rendered too close together.
    const edges = [];
    for (let i = 0; i < count; i++) {
        for (let j = i + 1; j < count; j++) {
            const distance = meanPixelDistance(chart, i, j);
            if (distance != null && distance < threshold) {
                edges.push([i, j]);
            }
        }
    }

    if (edges.length === 0) return offsets;

    // 2. Group datasets connected through overlap edges into clusters.
    const adjacency = Array.from({ length: count }, () => []);
    for (const [i, j] of edges) {
        adjacency[i].push(j);
        adjacency[j].push(i);
    }

    const clusters = [];
    const visited = new Array(count).fill(false);

    for (let k = 0; k < count; k++) {
        if (visited[k]) continue;
        const cluster = [];
        const stack = [k];
        visited[k] = true;
        while (stack.length) {
            const node = stack.pop();
            cluster.push(node);
            for (const neighbor of adjacency[node]) {
                if (!visited[neighbor]) {
                    visited[neighbor] = true;
                    stack.push(neighbor);
                }
            }
        }
        if (cluster.length > 1) clusters.push(cluster);
    }

    // 3. Fan each cluster out, keeping higher values visually higher.
    for (const cluster of clusters) {
        const ordered = cluster
            .slice()
            .sort(
                (a, b) =>
                    averageValue(chart.data.datasets[b].data) -
                    averageValue(chart.data.datasets[a].data)
            );

        const middle = (ordered.length - 1) / 2;
        ordered.forEach((datasetIndex, position) => {
            offsets[datasetIndex] = Math.round((position - middle) * spacing);
        });
    }

    return offsets;

}

function meanPixelDistance(chart, datasetIndexA, datasetIndexB) {

    const metaA = chart.getDatasetMeta(datasetIndexA);
    const metaB = chart.getDatasetMeta(datasetIndexB);

    let total = 0;
    let points = 0;

    const length = Math.min(metaA.data.length, metaB.data.length);

    for (let k = 0; k < length; k++) {
        const pointA = metaA.data[k];
        const pointB = metaB.data[k];
        if (!pointA || !pointB) continue;
        if (pointA.y == null || pointB.y == null) continue;
        total += Math.abs(pointA.y - pointB.y);
        points++;
    }

    if (points === 0) return null;

    return total / points;

}

function averageValue(data) {

    const values = (data || []).filter(v => v != null);
    if (values.length === 0) return 0;
    return values.reduce((sum, value) => sum + value, 0) / values.length;

}

// Draw values above every point, aligned with any applied fan offset.
const valueLabelPlugin = {

    id: 'valueLabel',

    afterDatasetsDraw(chart) {

        const { ctx } = chart;

        ctx.save();

        ctx.font = 'bold 12px Arial';
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';

        const offsets = chart._lineFanOffsets || chart.data.datasets.map(() => 0);

        chart.data.datasets.forEach((dataset, datasetIndex) => {

            const meta = chart.getDatasetMeta(datasetIndex);
            const offset = offsets[datasetIndex] || 0;

            meta.data.forEach((point, index) => {

                const value = dataset.data[index];

                if (value == null) return;

                ctx.fillText(
                    (value / 1000000).toFixed(1) + "M",
                    point.x,
                    point.y + offset - 14
                );

            });

        });

        ctx.restore();

    }

};

new Chart(
    document.getElementById("benchmarkChart"),
    {

        type: "line",

        data: {

            labels,

            datasets

        },

        options: {

            responsive: true,

            maintainAspectRatio: false,

            interaction: {

                intersect: false,

                mode: "index"

            },

            plugins: {

                legend: {

                    labels: {

                        color: "white",

                        font: {

                            size: 14,

                            weight: "bold"

                        }

                    }

                }

            },

            scales: {

                x: {

                    title: {

                        display: true,

                        text: "Day",

                        color: "white"

                    },

                    ticks: {

                        color: "white"

                    },

                    grid: {

                        color: "#333"

                    }

                },

                y: {

                    suggestedMin: Math.floor(minValue * 0.9),

                    suggestedMax: Math.ceil(maxValue * 1.1),

                    title: {

                        display: true,

                        text: "Fans / Member / Day",

                        color: "white"

                    },

                    ticks: {

                        color: "white",

                        callback(value) {

                            return (value / 1000000).toFixed(1) + "M";

                        }

                    },

                    grid: {

                        color: "#333"

                    }

                }

            }

        },

        plugins: [overlapSeparator, valueLabelPlugin]

    }
);

</script>

</body>

</html>
