<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body {
    margin: 0;
    padding: 30px;
    background: #111111;
    color: white;
    font-family: Arial, sans-serif;
}

h1 {
    margin: 0 0 12px 0;
}

.description {
    color: #b9bbbe;
    margin-bottom: 24px;
}

.section-title {
    margin-top: 30px;
    margin-bottom: 12px;
    font-size: 22px;
    font-weight: 700;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 30px;
    background: #1b1b1b;
    border-radius: 12px;
    overflow: hidden;
}

th {
    background: #202225;
    color: white;
    padding: 14px;
    text-align: center;
    font-size: 14px;
}

td {
    padding: 12px;
    text-align: center;
    border-bottom: 1px solid #2b2b2b;
}

tr:last-child td {
    border-bottom: none;
}

.chart-container {

    background:#1b1b1b;

    border-radius:12px;

    padding:20px;

    margin-bottom:30px;

}

.footer {
    margin-top: 24px;
    color: #8f98ab;
    font-size: 14px;
}

canvas{

    width:100% !important;

    height:420px !important;

}

</style>

</head>

<body>

<h1>{{TITLE}}</h1>

<div class="description">
    {{DESCRIPTION}}
</div>

<div class="section-title">
    Current Benchmark
</div>

<table>

    <thead>

        <tr>

            <th>Benchmark</th>
            <th>Entry<br>(Fans / Member / Day)</th>
            <th>Average<br>(Fans / Member / Day)</th>

        </tr>

    </thead>

    <tbody>

        {{BENCHMARK_PROJECTIONS}}

    </tbody>

</table>

<div class="section-title">
    Daily Benchmark Growth
</div>

<div class="chart-container">

    <canvas id="benchmarkChart"></canvas>

</div>

<div class="footer">

{{FOOTER}}

</div>

<script id="chart-data" type="application/json">
{{BENCHMARK_CHART_DATA}}
</script>

<script>

const chartData = JSON.parse(
    document.getElementById('chart-data').textContent
);

const labels = chartData.map(x => "Day " + x.day);

const top10 = chartData.map(x => x.top10);
const top30 = chartData.map(x => x.top30);
const top100 = chartData.map(x => x.top100);

const allValues = [...top10, ...top30, ...top100].filter(v => v != null);

const minValue = Math.min(...allValues);
const maxValue = Math.max(...allValues);

// Draw values above every point
const valueLabelPlugin = {

    id: 'valueLabel',

    afterDatasetsDraw(chart) {

        const { ctx } = chart;

        ctx.save();

        ctx.font = 'bold 12px Arial';
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';

        chart.data.datasets.forEach((dataset, datasetIndex) => {

            const meta = chart.getDatasetMeta(datasetIndex);

            meta.data.forEach((point, index) => {

                const value = dataset.data[index];

                if (value == null) return;

                ctx.fillText(
                    (value / 1000000).toFixed(1) + "M",
                    point.x,
                    point.y - 14
                );

            });

        });

        ctx.restore();

    }

};

new Chart(
    document.getElementById("benchmarkChart"),
    {

        type: "line",

        data: {

            labels,

            datasets: [

                {

                    label: "Top 10",

                    data: top10,

                    borderColor: "#ff4d4d",

                    backgroundColor: "rgba(255,77,77,0.12)",

                    fill: true,

                    borderWidth: 4,

                    pointRadius: 6,

                    pointHoverRadius: 7,

                    pointBorderWidth: 3,

                    pointBackgroundColor: "#111111",

                    tension: 0.45

                },

                {

                    label: "Top 30",

                    data: top30,

                    borderColor: "#ffd93d",

                    backgroundColor: "rgba(255,217,61,0.12)",

                    fill: true,

                    borderWidth: 4,

                    pointRadius: 6,

                    pointHoverRadius: 7,

                    pointBorderWidth: 3,

                    pointBackgroundColor: "#111111",

                    tension: 0.45

                },

                {

                    label: "Top 100",

                    data: top100,

                    borderColor: "#61b8ff",

                    backgroundColor: "rgba(97,184,255,0.12)",

                    fill: true,

                    borderWidth: 4,

                    pointRadius: 6,

                    pointHoverRadius: 7,

                    pointBorderWidth: 3,

                    pointBackgroundColor: "#111111",

                    tension: 0.45

                }

            ]

        },

        options: {

            responsive: true,

            maintainAspectRatio: false,

            interaction: {

                intersect: false,

                mode: "index"

            },

            plugins: {

                legend: {

                    labels: {

                        color: "white",

                        font: {

                            size: 14,

                            weight: "bold"

                        }

                    }

                }

            },

            scales: {

                x: {

                    title: {

                        display: true,

                        text: "Day",

                        color: "white"

                    },

                    ticks: {

                        color: "white"

                    },

                    grid: {

                        color: "#333"

                    }

                },

                y: {

                    suggestedMin: Math.floor(minValue * 0.9),

                    suggestedMax: Math.ceil(maxValue * 1.1),

                    title: {

                        display: true,

                        text: "Fans / Member / Day",

                        color: "white"

                    },

                    ticks: {

                        color: "white",

                        callback(value) {

                            return (value / 1000000).toFixed(1) + "M";

                        }

                    },

                    grid: {

                        color: "#333"

                    }

                }

            }

        },

        plugins: [valueLabelPlugin]

    }
);

</script>

</body>

</html>
