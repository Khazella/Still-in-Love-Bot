<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 32px;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;

    background-image:
        linear-gradient(
            rgba(10,12,18,.35),
            rgba(10,12,18,.35)
        ),
        url("{{BACKGROUND_IMAGE}}");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

.container {
    background: rgba(23,25,35,.45);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border: 1px solid rgba(255,255,255,.08);

    border-radius: 20px;
    overflow: hidden;

    box-shadow:
        0 0 40px rgba(0,0,0,.45),
        0 12px 40px rgba(0,0,0,.35);
}

/* =========================
   HEADER
========================= */

.header {
    padding: 32px 36px;
    border-bottom: 1px solid #2a2f3a;
}

.header-top {
    display: flex;
    align-items: center;
    gap: 32px;
}

.character-icon {
    width: 140px;
    height: 140px;
    object-fit: contain;
    flex-shrink: 0;
}

.header-content {
    flex: 1;
}

.rank-icon {
    width: 110px;
    height: 110px;
    object-fit: contain;
    flex-shrink: 0;
}

.title {
    font-size: 40px;
    font-weight: 700;
    margin-bottom: 14px;
    line-height: 1.2;
}

.subtitle {
    color: #8f98ab;
    font-size: 18px;
    line-height: 1.8;
}

/* =========================
   TABLE
========================= */

table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
}

thead {
    background: #1f2433;
    border-bottom: 1px solid #30384d;
}

thead th {
    height: 70px;
    vertical-align: middle;
}

th {
    text-align: center;
    padding: 16px 18px;
    font-size: 16px;
    font-weight: 700;
    color: #d8deea;
    letter-spacing: .5px;
    text-transform: uppercase;
}

td {
    padding: 16px 18px;
    font-size: 17px;
}

tbody tr {
    border-bottom: 1px solid rgba(255,255,255,.03);
}

tbody tr:nth-child(even) {
    background: rgba(255,255,255,.02);
}

tbody tr:hover {
    background: rgba(255,255,255,.04);
}

/* =========================
   COLUMN ALIGNMENT
========================= */

.rank {
    width: 70px;
    font-weight: 800;
    font-size: 24px;
    text-align: center;
}

.name {
    width: 240px;
    font-weight: 700;
    font-size: 21px;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.progress-cell {
    text-align: center;
}

.fans {
    width: 180px;
    text-align: right;
    font-weight: 700;
    font-size: 21px;
}

.daily {
    width: 170px;
    text-align: right;
    font-weight: 700;
    font-size: 21px;
}

.shame {
    width: 110px;
    text-align: center;
    font-weight: 800;
    font-size: 22px;
}

/* =========================
   PROGRESS BAR
========================= */

.progress {
    width: 100%;
    height: 18px;
    background: #2f3445;
    border-radius: 999px;
    overflow: hidden;
}

.fill {
    height: 100%;
    border-radius: 999px;
}

/* =========================
   FOOTER
========================= */

.footer {
    padding: 18px 28px;
    border-top: 1px solid #2a2f3a;
    color: #8f98ab;
    font-size: 14px;
}

/* =========================
   COLUMN WIDTHS
========================= */

.col-rank {
    width: 70px;
}

.col-name {
    width: 240px;
}

.col-fans {
    width: 180px;
}

.col-daily {
    width: 170px;
}

.col-shame {
    width: 110px;
}

</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="header-top">

            <img
                class="character-icon"
                src="{{CHARACTER_ICON}}"
            >

            <div class="header-content">

                <div class="title">
                    {{TITLE}}
                </div>

                <div class="subtitle">
                    {{DESCRIPTION}}
                </div>

            </div>

            <img
                class="rank-icon"
                src="{{RANK_ICON}}"
            >

        </div>

    </div>

    <table>

        <thead>
            <tr>
                <th class="col-rank">Rank</th>
                <th class="col-name">Trainer</th>
                <th>Progress</th>
                <th class="col-fans">Fans</th>
                <th class="col-daily">Daily</th>
                <th class="col-shame">Shame</th>
            </tr>
        </thead>

        <tbody>
            {{ROWS}}
        </tbody>

    </table>

    <div class="footer">
        {{FOOTER}}
    </div>

</div>

</body>
</html>
