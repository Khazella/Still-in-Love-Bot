<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body {
    margin: 0;
    padding: 30px;
    background: #111111;
    color: white;
    font-family: Arial, sans-serif;
}

h1 {
    margin: 0 0 12px 0;
}

.description {
    color: #b9bbbe;
    margin-bottom: 24px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 32px;
}

.stat-card {
    background: #1b1b1b;
    border: 1px solid #2b2b2b;
    border-radius: 12px;
    padding: 16px;
}

.stat-title {
    color: #8f98ab;
    font-size: 14px;
    margin-bottom: 8px;
}

.stat-value {
    font-size: 28px;
    font-weight: 700;
}

.chart-container {
    background: #1b1b1b;
    border: 1px solid #2b2b2b;
    border-radius: 12px;
    padding: 20px;
}

.footer {
    margin-top: 24px;
    color: #8f98ab;
    font-size: 14px;
}

</style>

</head>

<body>

<h1>{{TITLE}}</h1>

<div class="description">
    {{DESCRIPTION}}
</div>

<div class="stats">
    {{FIELDS}}
</div>

<div class="chart-container">
    <canvas
        id="trainerChart"
        width="1100"
        height="350"
    ></canvas>
</div>

<div class="footer">
    {{FOOTER}}
</div>

<script>

const chartData = JSON.parse('{{CHART_DATA}}');

const ctx =
    document.getElementById(
        'trainerChart'
    );

new Chart(
    ctx,
    {
        type: 'line',

        plugins: [
            {
                id: 'pointLabels',

                afterDatasetsDraw(chart) {

                    const { ctx } = chart;

                    chart.data.datasets.forEach(
                        (dataset, datasetIndex) => {

                            const meta =
                                chart.getDatasetMeta(
                                    datasetIndex
                                );

                            meta.data.forEach(
                                (point, index) => {

                                    const value =
                                        dataset.data[index];

                                    ctx.save();

                                    ctx.fillStyle =
                                        '#ffffff';

                                    ctx.font =
                                        'bold 10px Arial';

                                    ctx.textAlign =
                                        'center';

                                    ctx.textBaseline =
                                        'bottom';

                                    ctx.fillText(
                                        (value / 1000000).toFixed(1) + 'M',
                                        point.x,
                                        point.y - 8
                                    );

                                    ctx.restore();

                                }
                            );

                        }
                    );

                }
            }
        ],

        data: {

            labels:
                chartData.map(
                    (_, i) =>
                        `Day ${i + 1}`
                ),

            datasets: [
                {
                    label: 'Fans',

                    data: chartData,

                    borderColor:
                        '#ff3b3b',

                    backgroundColor:
                        'rgba(255,59,59,0.25)',

                    fill: true,

                    tension: 0.3,

                    borderWidth: 3,

                    pointRadius: 4,

                    pointHoverRadius: 6
                }
            ]
        },

        options: {

            responsive: false,

            animation: false,

            plugins: {

                legend: {

                    labels: {
                        color: '#ffffff'
                    }

                }

            },

            scales: {

                x: {

                    ticks: {
                        color: '#ffffff'
                    },

                    grid: {
                        color:
                            'rgba(255,255,255,0.1)'
                    }

                },

                y: {

                    ticks: {
                        color: '#ffffff'
                    },

                    grid: {
                        color:
                            'rgba(255,255,255,0.1)'
                    }

                }

            }

        }
    }
);

</script>

</body>
</html>
